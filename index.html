<!doctype html>
<html lang="ko">
  <head>

<script>
  window.addEventListener('error', function(e) {
    const div = document.createElement('div');
    div.style = 'color:red;font-size:20px;z-index:999999;position:fixed;top:0;left:0;background:white;padding:20px;border:2px solid red;max-width:100vw;word-break:break-all;';
    div.innerText = 'Global Error: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
    document.body.appendChild(div);
  });
  window.addEventListener('unhandledrejection', function(e) {
    const div = document.createElement('div');
    div.style = 'color:red;font-size:20px;z-index:999999;position:fixed;top:100px;left:0;background:white;padding:20px;border:2px solid red;max-width:100vw;word-break:break-all;';
    div.innerText = 'Unhandled Rejection: ' + (e.reason ? e.reason.stack || e.reason : e);
    document.body.appendChild(div);
  });
  const originalError = console.error;
  console.error = function(...args) {
    const div = document.createElement('div');
    div.style = 'color:red;font-size:20px;z-index:999999;position:fixed;top:200px;left:0;background:white;padding:20px;border:2px solid red;max-width:100vw;word-break:break-all;';
    div.innerText = 'Console Error: ' + args.join(' ');
    document.body.appendChild(div);
    originalError.apply(console, args);
  };
</script>
